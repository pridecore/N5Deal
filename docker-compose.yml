services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: n5deal
      POSTGRES_USER: n5deal_local
      POSTGRES_PASSWORD: n5deal_local
    ports:
      - "5432:5432"
    volumes:
      - n5deal-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n5deal_local -d n5deal"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  n5deal-postgres:
